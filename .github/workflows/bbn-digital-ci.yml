name: bbn.digital

on: push

jobs:
  linter:
    name: Lint with ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: pnpm i
      - run: pnpm eslint
  format:
    name: Format with Prettier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: pnpm i
      - run: pnpm format
  type-check:
    name: Check types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: pnpm i
      - run: pnpm type-check
